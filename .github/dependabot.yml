# Mantiene al dia las actions (fijadas por SHA en ci-cd.yml) y las deps de
# dev (requirements-dev.txt). Los PRs que abre pasan por el mismo CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-deps:
        patterns: ["*"]
